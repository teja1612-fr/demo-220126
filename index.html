<!DOCTYPE html>
<html>
<head>
    <title>Amazon Clone</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #f2f2f2;
        }
        header {
            background-color: #131921;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 24px;
        }
        .container {
            padding: 20px;
            text-align: center;
        }
        .card {
            background: white;
            padding: 20px;
            margin: 20px auto;
            width: 300px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        button {
            background-color: #febd69;
            border: none;
            padding: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header>Amazon Clone - CI/CD Demo</header>

<div class="container">
    <div class="card">
        <h3>Product 1</h3>
        <p>Price: ₹999</p>
        <button>Add to Cart</button>
    </div>
</div>

</body>
</html>
